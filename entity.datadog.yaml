    paths:
    - regional/istio/**
---
apiVersion: v3
kind: service
metadata:
  name: istio-cni
  description: Node agent that configures traffic redirection for ambient mesh workloads, enrolling pods into the mesh without an init container or sidecar.
  links:
  - name: Istio CNI documentation
    type: doc
    url: https://istio.io/latest/docs/setup/additional-setup/cni/
  - name: pt-arche-kubernetes-istio
    type: repo
    provider: Github
    url: https://github.com/osinfra-io/pt-arche-kubernetes-istio
  owner: pt-pneuma
spec:
  lifecycle: production
  tier: one
  type: infrastructure
datadog:
  codeLocations:
  - repositoryURL: https://github.com/osinfra-io/pt-pneuma.git
    paths:
    - regional/istio/**
---
apiVersion: v3
kind: service
metadata:
  name: istio-eastwestgateway
  description: Istio east-west gateway that carries HBONE traffic between clusters in the multi-network ambient mesh, terminating cross-cluster mTLS on port 15008.
  links:
  - name: Ambient multicluster documentation
    type: doc
    url: https://istio.io/latest/docs/ambient/install/multicluster/
  - name: pt-arche-kubernetes-istio
    type: repo
    provider: Github
    url: https://github.com/osinfra-io/pt-arche-kubernetes-istio
  owner: pt-pneuma
spec:
  lifecycle: production
  tier: one
  type: infrastructure
datadog:
  codeLocations:
  - repositoryURL: https://github.com/osinfra-io/pt-pneuma.git
    paths:
    - regional/istio/**
---
apiVersion: v3
kind: service
metadata:
  name: istio-ztunnel
  description: Node level zero trust tunnel that provides the ambient mesh layer four data plane, handling mTLS and traffic telemetry for enrolled workloads.
  links:
  - name: Ambient data plane documentation
    type: doc
    url: https://istio.io/latest/docs/ambient/architecture/data-plane/
  - name: pt-arche-kubernetes-istio
    type: repo
    provider: Github
    url: https://github.com/osinfra-io/pt-arche-kubernetes-istio
  owner: pt-pneuma
spec:
  lifecycle: production
  tier: one
  type: infrastructure
datadog:
  codeLocations:
  - repositoryURL: https://github.com/osinfra-io/pt-pneuma.git
    paths:
    - regional/istio/**
---
apiVersion: v3
kind: service
metadata:
  name: openbao
  displayName: OpenBao
  description: OpenBao secrets management service backed by encrypted Raft storage and exposed through the platform's protected ingress.
  links:
  - name: OpenBao API documentation
    type: doc
    url: https://openbao.org/docs/api/
  - name: OpenBao OpenAPI export
    type: doc
    url: https://openbao.org/docs/api/system/internal-specs-openapi/
  - name: OpenBao
    type: repo
    provider: Github
    url: https://github.com/openbao/openbao
  owner: pt-pneuma
spec:
  lifecycle: production
  tier: one
  type: infrastructure
datadog:
  codeLocations:
  - repositoryURL: https://github.com/osinfra-io/pt-pneuma.git
    paths:
    - config/openbao/**
    - regional/openbao/**
