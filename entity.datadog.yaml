---
apiVersion: v3
kind: system
metadata:
  name: pt-pneuma
  displayName: pneuma
  description: 'The breathing, dynamic layer of the platform where structure comes alive. Animates Corpus projects into workload environments: GKE clusters across multiple zones, cert-manager, Istio service mesh, Datadog cluster monitoring, and OPA Gatekeeper policy enforcement.'
  tags:
  - team:pt-pneuma
  - team-type:platform-team
  links:
  - name: pt-pneuma
    type: repo
    provider: Github
    url: https://github.com/osinfra-io/pt-pneuma
  contacts:
  - type: email
    contact: pt-pneuma@osinfra.io
  owner: pt-pneuma
spec:
  lifecycle: production
  tier: one
  components:
  - api:authentik
  - api:istio-test
  - service:agentgateway
  - service:authentik
  - service:cert-manager
  - service:cert-manager-cainjector
  - service:cert-manager-istio-csr
  - service:cert-manager-webhook
  - service:datadog-agent
  - service:datadog-cluster-agent
  - service:datadog-operator
  - service:gatekeeper-audit
  - service:gatekeeper-controller-manager
  - service:istio-cni
  - service:istio-control-plane
  - service:istio-eastwestgateway
  - service:istio-gateway
  - service:istio-test
  - service:istio-ztunnel
  - service:openbao
datadog:
  codeLocations:
  - repositoryURL: https://github.com/osinfra-io/pt-pneuma.git
    paths:
    - '**'
---
apiVersion: v3
kind: service
metadata:
  name: agentgateway
  description: agentgateway control plane and proxy for AI, MCP, and HTTP traffic, with an authentik-protected administration interface.
  links:
  - name: agentgateway documentation
    type: doc
    url: https://agentgateway.dev/docs/kubernetes/latest/
  - name: pt-arche-kubernetes-agentgateway
    type: repo
    provider: Github
    url: https://github.com/osinfra-io/pt-arche-kubernetes-agentgateway
  owner: pt-pneuma
spec:
  lifecycle: production
  tier: one
  type: infrastructure
datadog:
  codeLocations:
  - repositoryURL: https://github.com/osinfra-io/pt-pneuma.git
    paths:
    - regional/agentgateway/**
    - regional/istio/manifests/**
---
apiVersion: v3
kind: service
metadata:
  name: authentik
  description: authentik identity provider and proxy authentication service for platform applications, including Google sign-in and group-based access control.
  links:
  - name: authentik documentation
    type: doc
    url: https://docs.goauthentik.io/
  - name: pt-arche-kubernetes-authentik
    type: repo
    provider: Github
    url: https://github.com/osinfra-io/pt-arche-kubernetes-authentik
  owner: pt-pneuma
spec:
  lifecycle: production
  tier: one
  type: web
datadog:
  codeLocations:
  - repositoryURL: https://github.com/osinfra-io/pt-pneuma.git
    paths:
    - config/authentik/**
    - regional/authentik/**
---
apiVersion: v3
kind: api
metadata:
  name: authentik
  description: authentik API for managing identity sources, applications, providers, flows, users, groups, and access policies.
  owner: pt-pneuma
spec:
  type: openapi
  implementedBy:
  - service:authentik
  interface:
    fileRef: https://github.com/goauthentik/authentik/blob/4ec0d19b98da3c329781894cd550da95d3033954/schema.yml
  lifecycle: production
  tier: one
---
apiVersion: v3
kind: service
metadata:
  name: cert-manager
  description: Core cert-manager controller that manages certificate lifecycle including issuing, renewing, and revoking TLS certificates.
  links:
  - name: cert-manager documentation
    type: doc
    url: https://cert-manager.io/docs/
  - name: pt-arche-kubernetes-cert-manager
    type: repo
    provider: Github
    url: https://github.com/osinfra-io/pt-arche-kubernetes-cert-manager
  owner: pt-pneuma
spec:
  lifecycle: production
  tier: one
  type: infrastructure
datadog:
  codeLocations:
  - repositoryURL: https://github.com/osinfra-io/pt-pneuma.git
    paths:
    - regional/cert-manager/**
---
apiVersion: v3
kind: service
metadata:
  name: cert-manager-cainjector
  description: Injects CA certificates into Kubernetes resources such as validating and mutating webhook configurations and API services.
  links:
  - name: cert-manager CA injector
    type: doc
    url: https://cert-manager.io/docs/concepts/ca-injector/
  owner: pt-pneuma
spec:
  lifecycle: production
  tier: one
  type: infrastructure
datadog:
  codeLocations:
  - repositoryURL: https://github.com/osinfra-io/pt-pneuma.git
    paths:
    - regional/cert-manager/**
---
apiVersion: v3
kind: service
metadata:
  name: cert-manager-istio-csr
  description: Issues Istio workload certificates using cert-manager issuers, replacing the built-in Istio CA for mTLS certificate provisioning within the service mesh.
  links:
  - name: istio-csr documentation
    type: doc
    url: https://cert-manager.io/docs/usage/istio-csr/
  owner: pt-pneuma
spec:
  lifecycle: production
  tier: one
  type: infrastructure
datadog:
  codeLocations:
  - repositoryURL: https://github.com/osinfra-io/pt-pneuma.git
    paths:
    - regional/cert-manager/istio-csr/**
---
apiVersion: v3
kind: service
metadata:
  name: cert-manager-webhook
  description: Validates and mutates cert-manager custom resources via Kubernetes admission webhooks.
  links:
  - name: cert-manager webhook
    type: doc
    url: https://cert-manager.io/docs/concepts/webhook/
  owner: pt-pneuma
spec:
  lifecycle: production
  tier: one
  type: infrastructure
datadog:
  codeLocations:
  - repositoryURL: https://github.com/osinfra-io/pt-pneuma.git
    paths:
    - regional/cert-manager/**
---
apiVersion: v3
kind: service
metadata:
  name: datadog-agent
  description: Node-level agent that collects metrics, traces, and logs from Kubernetes nodes and workloads.
  links:
  - name: Datadog Agent documentation
    type: doc
    url: https://docs.datadoghq.com/containers/kubernetes/
  - name: pt-arche-kubernetes-datadog-operator
    type: repo
    provider: Github
    url: https://github.com/osinfra-io/pt-arche-kubernetes-datadog-operator
  owner: pt-pneuma
spec:
  lifecycle: production
  tier: one
  type: infrastructure
datadog:
  codeLocations:
  - repositoryURL: https://github.com/osinfra-io/pt-pneuma.git
    paths:
    - regional/datadog/**
---
apiVersion: v3
kind: service
metadata:
  name: datadog-cluster-agent
  description: Cluster-level agent that provides a centralized point for collecting cluster-wide metrics and orchestrating node-level agents.
  links:
  - name: Datadog Cluster Agent
    type: doc
    url: https://docs.datadoghq.com/containers/cluster_agent/
  owner: pt-pneuma
spec:
  lifecycle: production
  tier: one
  type: infrastructure
