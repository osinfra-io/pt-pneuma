apiVersion: v3
kind: service
metadata:
  name: datadog-operator
  description: Kubernetes operator that manages the lifecycle of Datadog Agent and Cluster Agent deployments.
  links:
  - name: Datadog Operator
    type: doc
    url: https://docs.datadoghq.com/containers/datadog_operator/
  - name: pt-arche-kubernetes-datadog-operator
    type: repo
    provider: Github
    url: https://github.com/osinfra-io/pt-arche-kubernetes-datadog-operator
  owner: pt-pneuma
spec:
  lifecycle: production
  tier: one
  type: infrastructure
datadog:
  codeLocations:
  - repositoryURL: https://github.com/osinfra-io/pt-pneuma.git
    paths:
    - regional/datadog/**
---
apiVersion: v3
kind: service
metadata:
  name: gatekeeper-audit
  description: OPA Gatekeeper audit controller that periodically evaluates existing resources against policy constraints for compliance.
  links:
  - name: OPA Gatekeeper documentation
    type: doc
    url: https://open-policy-agent.github.io/gatekeeper/website/docs/
  - name: pt-arche-kubernetes-opa-gatekeeper
    type: repo
    provider: Github
    url: https://github.com/osinfra-io/pt-arche-kubernetes-opa-gatekeeper
  owner: pt-pneuma
spec:
  lifecycle: production
  tier: one
  type: infrastructure
datadog:
  codeLocations:
  - repositoryURL: https://github.com/osinfra-io/pt-pneuma.git
    paths:
    - regional/opa-gatekeeper/**
---
apiVersion: v3
kind: service
metadata:
  name: gatekeeper-controller-manager
  description: OPA Gatekeeper admission controller that enforces policy constraints on Kubernetes resource creation and updates.
  links:
  - name: OPA Gatekeeper documentation
    type: doc
    url: https://open-policy-agent.github.io/gatekeeper/website/docs/
  owner: pt-pneuma
spec:
  lifecycle: production
  tier: one
  type: infrastructure
datadog:
  codeLocations:
