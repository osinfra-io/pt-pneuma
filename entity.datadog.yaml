    paths:
    - regional/opa-gatekeeper/**
---
apiVersion: v3
kind: service
metadata:
  name: istio-gateway
  description: Istio ingress gateway that handles external traffic routing into the service mesh across multi-cluster deployments.
  links:
  - name: Istio gateway documentation
    type: doc
    url: https://istio.io/latest/docs/tasks/traffic-management/ingress/
  - name: pt-arche-kubernetes-istio
    type: repo
    provider: Github
    url: https://github.com/osinfra-io/pt-arche-kubernetes-istio
  owner: pt-pneuma
spec:
  lifecycle: production
  tier: one
  type: web
datadog:
  codeLocations:
  - repositoryURL: https://github.com/osinfra-io/pt-pneuma.git
    paths:
    - regional/istio/**
---
apiVersion: v3
kind: service
metadata:
  name: istio-test
  description: Synthetic test service deployed to validate Istio service mesh connectivity, routing, and mTLS across clusters.
  links:
  - name: pt-pneuma-istio-test
    type: repo
    provider: Github
    url: https://github.com/osinfra-io/pt-pneuma-istio-test
  owner: pt-pneuma
spec:
  lifecycle: production
  tier: three
  type: web
datadog:
  codeLocations:
  - repositoryURL: https://github.com/osinfra-io/pt-pneuma.git
    paths:
    - config/datadog/**
    - regional/istio/test-workload/**
  - repositoryURL: https://github.com/osinfra-io/pt-pneuma-istio-test.git
    paths:
    - '**'
---
apiVersion: v3
kind: api
metadata:
  name: istio-test
  description: Diagnostic API for validating Istio routing, metadata, and gateway authentication.
  owner: pt-pneuma
spec:
  type: openapi
  implementedBy:
  - service:istio-test
  interface:
    fileRef: https://github.com/osinfra-io/pt-pneuma-istio-test/blob/main/openapi.yaml
  lifecycle: production
  tier: three
---
apiVersion: v3
kind: service
metadata:
  name: istio-control-plane
  description: Istio control plane that manages service mesh configuration, certificate distribution, and proxy sidecar injection.
  links:
  - name: Istio architecture
    type: doc
    url: https://istio.io/latest/docs/ops/deployment/architecture/
  - name: pt-arche-kubernetes-istio
    type: repo
    provider: Github
    url: https://github.com/osinfra-io/pt-arche-kubernetes-istio
  owner: pt-pneuma
spec:
  lifecycle: production
  tier: one
  type: infrastructure
datadog:
