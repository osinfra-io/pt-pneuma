# OpenBao Helm Chart Values
# https://openbao.org/docs/platform/k8s/helm/

global:
  tlsDisable: false

injector:
  enabled: true

server:
  # The TLS Secret is mounted by the chart at /openbao/userconfig/openbao-tls.
  extraEnvironmentVars:
    BAO_CACERT: /openbao/userconfig/openbao-tls/ca.crt

  extraVolumes:
    - name: openbao-tls
      type: secret

  affinity: |
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
              app.kubernetes.io/instance: openbao
              component: server
          topologyKey: kubernetes.io/hostname

  auditStorage:
    enabled: true

  service:
    annotations:
      cloud.google.com/app-protocols: '{"https":"HTTPS"}'
      cloud.google.com/backend-config: '{"default":"openbao-backend"}'
      cloud.google.com/neg: '{"ingress": true}'
    type: NodePort

  ha:
    enabled: true
    replicas: 1
    raft:
      enabled: true

  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 250m
      memory: 256Mi

ui:
  enabled: true
