# OpenBao Helm Chart Values
# https://openbao.org/docs/platform/k8s/helm/

global:
  tlsDisable: false

injector:
  annotations:
    ad.datadoghq.com/sidecar-injector.logs: '[{"source":"vault","service":"openbao-injector"}]'

  enabled: true

server:
  annotations:
    ad.datadoghq.com/openbao.checks: |
      {
        "vault": {
          "init_config": {},
          "instances": [
            {
              "api_url": "https://%%host%%:8200/v1",
              "detect_leader": true,
              "no_token": true,
              "tls_verify": false,
              "use_openmetrics": true
            }
          ]
        }
      }
    ad.datadoghq.com/openbao.logs: '[{"source":"vault","service":"openbao"}]'

  configAnnotation: true

  # The TLS Secret is mounted by the chart at /openbao/userconfig/openbao-tls.
  extraEnvironmentVars:
    BAO_CACERT: /openbao/userconfig/openbao-tls/ca.crt

  extraVolumes:
    - name: openbao-tls
      type: secret

  affinity: |
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
              app.kubernetes.io/instance: openbao
              component: server
          topologyKey: kubernetes.io/hostname

  auditStorage:
    enabled: true

  service:
    annotations:
      cloud.google.com/app-protocols: '{"https":"HTTPS"}'
      cloud.google.com/backend-config: '{"default":"openbao-backend"}'
      cloud.google.com/neg: '{"ingress": true}'
    type: NodePort

  updateStrategyType: RollingUpdate

  ha:
    enabled: true
    replicas: 1
    raft:
      enabled: true

  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 250m
      memory: 256Mi

ui:
  enabled: true
